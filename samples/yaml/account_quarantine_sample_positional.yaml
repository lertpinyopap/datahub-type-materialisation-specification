# yaml-language-server: $schema=../../schema/type-materialisation.schema.json
id: account_quarantine_sample_positional
description: Demonstrates a headerless positional CSV that evolves the quarantine table shape.
control_data:
  materialisation_type: table
  change_type: scd1
  failure_mode: quarantine_row
  quarantine:
    table: account_QUARANTINE_SAMPLE__QUARANTINE
source:
  format: csv
  header: false
  load_method: dbt_seed
  seed:
    file: ../csv/broken/account_quarantine_sample_positional.csv
    name: account_quarantine_sample_positional_source
    schema: TMP
  delimiter: ","
  quotechar: '"'
  lineterminator: "\n"
  quoting: minimal
target:
  id: account_quarantine_sample_positional
  table_name: account_QUARANTINE_SAMPLE
  schema: TMP
  fields:
    - id: account_id
      source:
        pos: 0
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
      unique: true
      validations:
        - type: min_length
          value: 16
        - type: max_length
          value: 20
        - type: regex
          pattern: "^[A-Z0-9]+$"
        - type: custom
          macro: account_macros.validate_account_number
    - id: account_name
      source:
        pos: 1
      data_type: varchar(255)
      transforms:
        - type: trim
      nullable: true
      unique: false
    - id: account_status
      source:
        pos: 2
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: true
      unique: false
