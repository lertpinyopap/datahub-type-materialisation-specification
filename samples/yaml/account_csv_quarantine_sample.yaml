# yaml-language-server: $schema=../../schema/type-materialisation.schema.json
id: account_csv_quarantine_sample
description: Demonstrates five accepted CSV rows and two rows written to quarantine.
control_data:
  materialisation_type: table
  change_type: scd1
  failure_mode: quarantine_row
  quarantine:
    table: account_quarantine_sample__QUARANTINE
source:
  format: csv
  header: true
  load_method: dbt_seed
  seed:
    file: ../csv/broken/account_csv_quarantine_mix.csv
    name: account_quarantine_sample_source
    schema: TMP
  delimiter: ","
  quotechar: '"'
  lineterminator: "\r\n"
  quoting: minimal
target:
  id: account_quarantine_sample
  schema: TMP
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
      unique: true
      validations:
        - type: min_length
          value: 16
        - type: max_length
          value: 20
        - type: regex
          pattern: "^[A-Z0-9]+$"
        - type: custom
          macro: account_macros.validate_account_number
    - id: account_name
      source:
        pos: 1
        column: account_name
      data_type: varchar(255)
      transforms:
        - type: trim
      nullable: true
      unique: false
