# yaml-language-server: $schema=../../schema/type-materialisation.schema.json
id: account
description: Maps raw account CSV data into a typed account table.
control_data:
  materialisation_type: table
  change_type: scd1
  business_key:
    fields:
      - account_id
  failure_mode: quarantine_row
  quarantine:
    table: account__QUARANTINE
source:
  format: csv
  header: true
  location:
    schema: TMP
    stage: "@csv_stage"
    filename: account_csv.csv
  upload:
    enabled: false
  delimiter: ","
  quotechar: '"'
  lineterminator: "\r\n"
  quoting: minimal
target:
  id: account
  schema: TMP
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
      transforms:
        - type: trim
      nullable: false
      unique: true
      validations:
        - type: min_length
          value: 16
        - type: max_length
          value: 20
        - type: regex
          pattern: "^[A-Z0-9]+$"
        - type: custom
          macro: account_macros.validate_account_number
    - id: account_name
      source:
        pos: 1
        column: account_name
      data_type: varchar(255)
      transforms:
        - type: trim
        - type: custom
          macro: account_macros.normalise_account_name
      nullable: true
      unique: false
