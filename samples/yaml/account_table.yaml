# yaml-language-server: $schema=../../schema/type-materialisation.schema.json
id: account
description: Maps landed account table data into a typed account table.
control_data:
  materialisation_type: table
  change_type: scd1
  business_key:
    mode: raw
    fields:
      - account_id
  failure_mode: fail_load
source:
  format: table
  query: |
    select *
    from TMP.{{ env_var('ENV') }}_account_file_landed
    where load_batch_id = '{{ var('load_batch_id') }}'
target:
  id: account
  schema: TMP
  fields:
    - id: account_id
      source:
        column: account_id
      data_type: varchar(20)
      nullable: false
      unique: true
    - id: account_name
      source:
        column: account_name
      data_type: varchar(255)
      transforms:
        - type: trim
        - type: custom
          macro: account_macros.normalise_account_name
      nullable: true
      unique: false
