# yaml-language-server: $schema=../schema/type-materialisation.schema.json
id: account_csv
description: Maps raw account CSV data into a typed account table.
control_data:
  materialisation_type: table
  failure_mode: quarantine_row
source:
  format: csv
  separator: ","
  header: true
target:
  name: account
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
      nullable: false
      unique: true
      validations:
        - type: min_length
          value: 16
        - type: max_length
          value: 20
    - id: account_name
      source:
        pos: 1
        column: account_name
      data_type: varchar(255)
      nullable: true
      unique: false
