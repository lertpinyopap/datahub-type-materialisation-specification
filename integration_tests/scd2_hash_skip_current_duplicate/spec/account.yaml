id: scd2_hash_skip_current_duplicate
control_data:
  materialisation_type: table
  change_type: scd2
  scd:
    business_key:
      - account_id
    delete_detection:
      mode: missing_from_source
    valid_from_datetime:
      valid_from_datetime_selection: explicit
      value: '{{ var("valid_from_datetime") }}'
    valid_to_datetime:
      valid_to_datetime_selection: next
    valid_from_to_mode: continuous
    business_data_hash:
      mode: include
      fields:
        - account_value
    business_data_hash_duplicate_mode: skip
source:
  format: csv
  header: true
  load_method: dbt_seed
  seed:
    file: ../data/load_001_source.csv
    name: account_hash_skip_source_seed
target:
  id: account
  schema: business
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
    - id: account_value
      source:
        pos: 1
        column: account_value
      data_type: number(10,0)
