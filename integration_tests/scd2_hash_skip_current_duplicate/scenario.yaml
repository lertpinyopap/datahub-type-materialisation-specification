name: scd2_hash_skip_current_duplicate
description: SCD2 auto skips current duplicates and updates historical duplicate boundaries.
spec: spec/account.yaml
initial_target: data/initial_target.csv
target:
  expected_columns:
    - ACCOUNT_ID
    - ACCOUNT_VALUE
    - IS_CURRENT_FLAG
    - IS_DELETED_FLAG
    - VALID_FROM_DATETIME
    - VALID_TO_DATETIME
    - BUSINESS_DATA_HASH
  order_by:
    - ACCOUNT_ID
    - VALID_FROM_DATETIME
checks:
  - Load 001 repeats current value 1 and must be skipped because the current business hash matches.
  - Load 002 changes A1 from value 1 to value 2 and must create a new current SCD2 version.
  - Load 003 changes A1 from value 2 back to value 1 and must create another current SCD2 version.
  - The final value 1 has the same hash as the original historical row but is not skipped because the current hash differs.
  - Load 004 adds a historical duplicate of value 1 and must move the matching value 1 boundary backward.
loads:
  - name: load_001
    source_csv: data/load_001_source.csv
    expected_target: data/expected_after_load_001.csv
    dbt_vars:
      insert_time: "2026-09-01T00:00:00Z"
  - name: load_002
    source_csv: data/load_002_source.csv
    expected_target: data/expected_after_load_002.csv
    dbt_vars:
      insert_time: "2026-09-02T00:00:00Z"
  - name: load_003
    source_csv: data/load_003_source.csv
    expected_target: data/expected_after_load_003.csv
    dbt_vars:
      insert_time: "2026-09-03T00:00:00Z"
  - name: load_004
    source_csv: data/load_004_source.csv
    expected_target: data/expected_after_load_004.csv
    dbt_vars:
      insert_time: "2026-09-02T12:00:00Z"
