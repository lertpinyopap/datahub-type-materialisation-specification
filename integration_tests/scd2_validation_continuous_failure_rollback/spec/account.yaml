id: scd2_validation_continuous_failure_rollback
control_data:
  materialisation_type: table
  change_type: scd2_auto
  business_key:
    mode: raw
    fields:
      - account_id
  scd:
    insert_time: '{{ var("insert_time") }}'
    scd2_validation: continuous
source:
  format: csv
  header: true
  load_method: dbt_seed
  seed:
    file: ../data/load_001_source.csv
    name: account_scd2_validation_continuous_source_seed
target:
  id: account
  schema: business
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
      unique: true
    - id: account_value
      source:
        pos: 1
        column: account_value
      data_type: number(10,0)
