name: scd2_continuous_field_validity
description: Continuous SCD2 auto windows from insert_time.
spec: spec/account.yaml
dbt:
  unit_test_csv: data/load_001_source.csv
target:
  expected_columns:
    - ACCOUNT_ID
    - ACCOUNT_NAME
    - IS_CURRENT_FLAG
    - IS_DELETED_FLAG
    - VALID_FROM_DATETIME
    - VALID_TO_DATETIME
  order_by:
    - ACCOUNT_ID
    - VALID_FROM_DATETIME
checks:
  - A1 has one SCD2 auto version after the first source load.
  - The first A1 version starts at platform start of time.
  - The A1 version is current and open-ended at platform end of time.
  - No A1 version is marked as deleted.
loads:
  - name: load_001
    source_csv: data/load_001_source.csv
    expected_target: data/expected_after_load_001.csv
