id: scd2_continuous_field_validity
control_data:
  materialisation_type: table
  change_type: scd2
  scd:
    business_key:
      - account_id
    valid_from_datetime:
      valid_from_datetime_selection: field
      field: source_changed_at
    valid_to_datetime:
      valid_to_datetime_selection: next
    valid_from_to_mode: continuous
    business_data_hash:
      mode: include
      fields:
        - account_name
source:
  format: csv
  header: true
  load_method: dbt_seed
  seed:
    file: ../data/load_001_source.csv
    name: account_source_seed
target:
  id: account
  schema: business
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
    - id: account_name
      source:
        pos: 1
        column: account_name
      data_type: varchar(255)
    - id: source_changed_at
      source:
        pos: 2
        column: source_changed_at
      data_type: timestamp_tz
