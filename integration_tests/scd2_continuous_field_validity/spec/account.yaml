id: scd2_continuous_field_validity
control_data:
  materialisation_type: table
  change_type: scd2_auto
  business_key:
    fields:
      - account_id
  scd:
    insert_time: "2026-07-05T00:00:00Z"
source:
  format: csv
  header: true
  load_method: dbt_seed
  seed:
    file: ../data/load_001_source.csv
    name: account_source_seed
target:
  id: account
  schema: business
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
      unique: true
    - id: account_name
      source:
        pos: 1
        column: account_name
      data_type: varchar(255)
