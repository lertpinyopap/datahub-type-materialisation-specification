name: scd2_missing_from_source_delete
description: SCD2 auto does not create missing-from-source delete versions.
spec: spec/account.yaml
dbt:
  unit_test_csv: data/load_001_source.csv
initial_target: data/initial_target.csv
target:
  expected_columns:
    - ACCOUNT_ID
    - ACCOUNT_NAME
    - IS_CURRENT_FLAG
    - IS_DELETED_FLAG
    - VALID_FROM_DATETIME
    - VALID_TO_DATETIME
    - BUSINESS_DATA_HASH
  order_by:
    - ACCOUNT_ID
    - VALID_FROM_DATETIME
checks:
  - A1 was present in the current target but absent from the incoming source.
  - A1 remains current because SCD2 auto does not infer missing-from-source deletes.
  - A2 remains current, active, and open-ended because it is still present with the same business hash.
  - BUSINESS_DATA_HASH values assert SHA2-256 of `A1|Acme` and `A2|Beta`.
loads:
  - name: load_001
    source_csv: data/load_001_source.csv
    expected_target: data/expected_after_load_001.csv
