name: scd2_hash_update_historical_boundary
description: SCD2 auto moves a matching historical boundary backward.
spec: spec/account.yaml
initial_target: data/initial_target.csv
target:
  expected_columns:
    - ACCOUNT_ID
    - ACCOUNT_VALUE
    - IS_CURRENT_FLAG
    - IS_DELETED_FLAG
    - VALID_FROM_DATETIME
    - VALID_TO_DATETIME
    - BUSINESS_DATA_HASH
  order_by:
    - ACCOUNT_ID
    - VALID_FROM_DATETIME
checks:
  - A1 starts with two historical versions.
  - Load 001 repeats current value 2 with a historical insert_time.
  - SCD2 auto moves the value 2 boundary backward to the incoming insert_time.
  - The old value 2 boundary row is not retained.
loads:
  - name: load_001
    source_csv: data/load_001_source.csv
    expected_target: data/expected_after_load_001.csv
    dbt_vars:
      insert_time: "2026-09-02T00:00:00Z"
