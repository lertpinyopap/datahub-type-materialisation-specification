id: scd1_table_source_query_quarantine
control_data:
  materialisation_type: table
  change_type: scd1
  business_key:
    fields:
      - account_id
  failure_mode: quarantine_row
source:
  format: table
  schema: TMP
  table: account_query_quarantine_source
  query: |
    select account_id, account_name, account_priority
    from TMP.account_query_quarantine_source
    where load_batch_id = 'LOAD_001'
target:
  id: account
  schema: business
  fields:
    - id: account_id
      source:
        column: account_id
      data_type: varchar(20)
      validations:
        - type: regex
          pattern: "^A[0-9]$"
    - id: account_name
      source:
        column: account_name
      data_type: varchar(255)
    - id: account_priority
      source:
        column: account_priority
      data_type: number(10,0)
