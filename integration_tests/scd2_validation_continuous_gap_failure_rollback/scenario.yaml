name: scd2_validation_continuous_gap_failure_rollback
description: SCD2 continuous validation gap failure leaves the target unchanged.
spec: spec/account.yaml
initial_target: data/initial_target.csv
target:
  expected_columns:
    - ACCOUNT_ID
    - ACCOUNT_VALUE
    - ACCOUNT_BUSINESS_KEY
    - IS_CURRENT_FLAG
    - IS_DELETED_FLAG
    - VALID_FROM_DATETIME
    - VALID_TO_DATETIME
    - BUSINESS_DATA_HASH
    - AUDIT_DATA_PROCESS_KEY
    - AUDIT_CREATED_DATETIME
    - AUDIT_LAST_CHANGED_DATETIME
  order_by:
    - ACCOUNT_ID
    - VALID_FROM_DATETIME
checks:
  - A1 starts with one valid current row and is touched by load 001.
  - B1 starts with a gap between neighbouring historical and current rows.
  - Continuous SCD2 validation checks the whole post-load target and finds the untouched B1 gap.
  - The target rows and audit metadata remain unchanged after the failed load.
loads:
  - name: load_001
    source_csv: data/load_001_source.csv
    expect_dbt_success: false
    expected_target: data/expected_after_load_001.csv
    dbt_vars:
      insert_time: "2026-06-01T00:00:00Z"
