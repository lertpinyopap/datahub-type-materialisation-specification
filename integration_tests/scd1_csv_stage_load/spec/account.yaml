id: scd1_csv_stage_load
control_data:
  materialisation_type: table
  change_type: scd1
  business_key:
    fields:
      - account_id
  failure_mode: fail_load
source:
  format: csv
  header: false
  location:
    schema: TMP
    stage: csv_stage
    filename: load_001_source.csv
target:
  id: account
  schema: business
  fields:
    - id: account_id
      source:
        pos: 0
      data_type: varchar(20)
    - id: account_name
      source:
        pos: 1
      data_type: varchar(255)
    - id: account_priority
      source:
        pos: 2
      data_type: number(10,0)
