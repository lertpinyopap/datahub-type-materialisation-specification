id: scd1_quarantine_regex_validation
control_data:
  materialisation_type: table
  change_type: scd1
  failure_mode: quarantine_row
source:
  format: csv
  header: true
  load_method: dbt_seed
  seed:
    file: ../data/load_001_source.csv
    name: account_quarantine_source_seed
target:
  id: account
  schema: business
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
      nullable: false
      validations:
        - type: regex
          pattern: "^A[0-9]{3}$"
    - id: account_name
      source:
        pos: 1
        column: account_name
      data_type: varchar(255)
    - id: account_status
      source:
        pos: 2
        column: account_status
      data_type: varchar(20)
