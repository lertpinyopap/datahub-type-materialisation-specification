id: scd1_csv_date_timestamp_formats
control_data:
  materialisation_type: table
  change_type: scd1
  business_key:
    fields:
      - account_id
source:
  format: csv
  header: false
  load_method: stage
  location:
    schema: TMP
    stage: csv_stage
    filename: load_001_source.csv
target:
  id: account
  schema: business
  fields:
    - id: account_id
      source:
        pos: 0
        column: account_id
      data_type: varchar(20)
    - id: opened_on_iso
      source:
        pos: 1
        column: opened_on_iso
      data_type: date
      transforms:
        - type: parse_date
          format: "%Y-%m-%d"
    - id: opened_on_au
      source:
        pos: 2
        column: opened_on_au
      data_type: date
      transforms:
        - type: parse_date
          format: "%d/%m/%Y"
    - id: opened_on_named
      source:
        pos: 3
        column: opened_on_named
      data_type: date
      transforms:
        - type: parse_date
          format: "%d-%b-%Y"
    - id: opened_at_offset
      source:
        pos: 4
        column: opened_at_offset
      data_type: timestamp_tz
      transforms:
        - type: parse_timestamp
          format: "%Y-%m-%dT%H:%M:%S%z"
    - id: reviewed_at_utc
      source:
        pos: 5
        column: reviewed_at_utc
      data_type: timestamp_tz
      transforms:
        - type: parse_timestamp
          format: "%Y-%m-%d %H:%M:%S"
          timezone_if_missing: UTC
